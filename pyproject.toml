[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pptxgym"
version = "0.1.0"
description = "Scale computer-use RL tasks from real PowerPoint decks"
requires-python = ">=3.10"
dependencies = [
    "python-pptx>=0.6.23",
    "lxml>=4.9",
    "Pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
pptxgym = "pptxgym.cli:main"

[tool.setuptools.packages.find]
include = ["pptxgym*"]
